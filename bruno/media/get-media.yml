info:
  name: "Get a media item"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/media/Q25188"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.title
      operator: eq
      value: "Inception"
    - expression: res.body.image.kind
      operator: eq
      value: "logo"
    - expression: res.headers.etag
      operator: isString
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.headers.etag
        method: jsonq
      variable:
        name: etag
        scope: runtime

settings:
  encodeUrl: true

docs: |-
  One item, with the fields of its type (a movie has `directors`, `cast` and `runtimeMinutes`).

  `image` is a file from Wikimedia Commons, which only hosts freely licensed files: open its `url` in a browser. `author`, `license` and `sourceUrl` say how to credit it (`author` is null when the license doesn't require credit).

  Look at the `ETag` and `Cache-Control` response headers: "Get it again if changed" reuses the ETag.
