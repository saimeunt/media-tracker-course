info:
  name: "Next page"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/media?type=movie&sort=-popularity&limit=5&cursor={{nextCursor}}"
  params:
    - name: type
      value: "movie"
      type: query
    - name: sort
      value: "-popularity"
      type: query
    - name: limit
      value: "5"
      type: query
    - name: cursor
      value: "{{nextCursor}}"
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.items
      operator: length
      value: "5"

settings:
  encodeUrl: true

docs: |-
  Uses the `nextCursor` saved by "List media". The other parameters must stay the same:
  a cursor made for another sort is rejected with 400.
