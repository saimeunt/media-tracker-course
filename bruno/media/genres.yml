info:
  name: "Genres"
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/genres?type=book"
  params:
    - name: type
      value: "book"
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body[0].name
      operator: isString

settings:
  encodeUrl: true

docs: |-
  Genres normalized from Wikidata's ("science fiction film", "science fiction novel"...) into
  tags ("science fiction"). Use a name as the `genre` parameter of "List media".
