info:
  name: "Get the media's stats"
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/media/Q83495"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.stats.ratingCount
      operator: gte
      value: "1"

settings:
  encodeUrl: true
