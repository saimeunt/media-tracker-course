info:
  name: "Alice's stats"
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/users/66f4a1000000000000000001/stats"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.byType
      operator: length
      value: "4"

settings:
  encodeUrl: true

docs: |-
  A summary of the library, computed by an aggregation pipeline (on MongoDB).
