info:
  name: "Who am I"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/auth/me"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.email
      operator: eq
      value: "alice@example.com"

settings:
  encodeUrl: true

docs: |-
  Returns the signed-in user, found from the cookie. `401` when signed out.
