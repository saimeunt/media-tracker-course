info:
  name: "Wrong password"
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "email": "alice@example.com",
        "password": "not-the-password"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true

docs: |-
  Same answer for a wrong password and an unknown email, so it doesn't reveal who has an account.
