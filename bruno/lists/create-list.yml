info:
  name: "Create a list"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/lists"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "name": "Weekend watchlist",
        "description": "Films for a rainy weekend",
        "visibility": "public"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.headers.location
      operator: isString
    - expression: res.body.items
      operator: length
      value: "0"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: listId
        scope: runtime

settings:
  encodeUrl: true

docs: |-
  `201 Created`, with a `Location` header holding the URL of the new list.
  The new list's id is saved as `listId` for the next requests.
