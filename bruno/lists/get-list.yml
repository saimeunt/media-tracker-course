info:
  name: "Get the list"
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/lists/{{listId}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.name
      operator: eq
      value: "Weekend watchlist"

settings:
  encodeUrl: true
