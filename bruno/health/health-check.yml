info:
  name: Health check
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/health"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.ok
      operator: eq
      value: "true"

settings:
  encodeUrl: true

docs: |-
  The simplest request: no parameters, no body. Open the Timeline tab to see the raw
  request line, the response status line and the headers.
